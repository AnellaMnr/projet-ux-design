<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — ESIEE Paris</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="page-connexion">
    <main>
        <form method="post" class="connexion-form">
            <img
                class="logo-esiee"
                src="{{ url_for('static', filename='images/logo-esiee.png') }}"
                alt="ESIEE Paris"
            >

            <div class="connexion-titre">
                <h1>Mes notes</h1>
                <p>Connecte-toi pour voir tes résultats.</p>
            </div>

            <input
                type="hidden"
                name="csrf_token"
                value="{{ session['csrf_token'] }}"
            >

            <div class="champ">
                <label for="email">E-mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    placeholder="prenom.nom@example.com"
                    required
                    autofocus
                >
            </div>

            <div class="champ">
                <label for="mot_de_passe">Mot de passe</label>
                <input
                    id="mot_de_passe"
                    name="mot_de_passe"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            {% if erreur %}
                <div class="erreur" role="alert">
                    {{ erreur }}
                </div>
            {% endif %}

            <button type="submit">Se connecter</button>

            <p class="mention-demo">Prototype · données fictives</p>
        </form>
    </main>
</body>
</html>
