<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — Portail étudiant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <header class="bandeau">
<a
    class="logo-lien"
    href="{{ url_for('connexion') }}"
    aria-label="Accueil du portail étudiant"
>
    <img
        class="logo-esiee"
        src="{{ url_for('static', filename='images/logo-esiee.png') }}"
        alt="ESIEE Paris"
    >
</a>
        <span>Portail étudiant — Démonstration</span>
    </header>

    <main>
        <h1>Connexion</h1>

        <form method="post" class="connexion-form">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ session['csrf_token'] }}"
            >

            <label for="email">Adresse e-mail</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                required
            >

            <label for="mot_de_passe">Mot de passe</label>
            <input
                id="mot_de_passe"
                name="mot_de_passe"
                type="password"
                autocomplete="current-password"
                required
            >

            {% if erreur %}
                <div class="erreur" role="alert">
                    {{ erreur }}
                </div>
            {% endif %}

            <button type="submit">Se connecter</button>
        </form>
    </main>
</body>
</html>
